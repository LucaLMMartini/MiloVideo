[project]
name = "video-feature-extractor-backend"
version = "0.1.0"
description = "Extracts digital features, connectivity, and UI flows from videos."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
openai = ["openai>=1.40", "opencv-python>=4.10"]
gemini = ["google-genai>=0.3"]
claude = ["anthropic>=0.39", "opencv-python>=4.10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
